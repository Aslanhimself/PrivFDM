model:
#  base_learning_rate: 4.5e-6
  learning_rate1: 4.5e-4  # Pre-training Autoencoder learning rate
  learning_rate2: 0  # Only for code

  target: ldm.models.autoencoder.AutoencoderKL
  params:
    monitor: "val/rec_loss"
    embed_dim: 3
    ddconfig:
      double_z: True
      z_channels: 3
      resolution: 32
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,3]
      num_res_blocks: 2
      attn_resolutions: [32,16,8 ]
      dropout: 0.0
    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 50001
        kl_weight: 0.000001
        disc_weight: 0.5

data:

  batch_size1: 50  # Pre-training Autoencoder batch size
  batch_size2: 0   # Only for code

  target: main.DataModuleFromConfig
  params:
    batch_size: 50
    wrap: false
    train:
      target: ldm.data.celeba.CelebATrain
      params:
        config:
          size: 32
    validation:
      target: ldm.data.celeba.CelebAValidation
      params:
        config:
          size: 32

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 5000
        max_images: 8
        increase_log_steps: false

  trainer:
    benchmark: True
    accumulate_grad_batches: 2

    epochs1: 50 # Pre-training Autoencoder epochs
    epochs2: 0 # Only for code

#    max_epochs : 50
