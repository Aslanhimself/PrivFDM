model:

  learning_rate1: 3e-4
  learning_rate2: 3e-4

  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
#    ckpt_path: ""

    linear_start: 0.0015
    linear_end: 0.0195
    timesteps: 1000
    num_timesteps_cond: 1
    log_every_t: 200
    s: 1000

    loss_type: l2
    first_stage_key: "image"
    cond_stage_key: "class_label"
#    cond_stage_config: "__is_unconditional__"
#    concat_mode: false

    image_size: 8
    channels: 3

    # Training options
    cond_stage_trainable: False
    conditioning_key: "adm"
#    cond_stage_trainable: True
#    conditioning_key: "crossattn"

    monitor: "val/loss_simple_ema"

    dp_config:
      enabled: true
      epsilon: 10
      delta: 1.0e-06
      max_grad_norm: 1
      poisson_sampling: true
      max_batch_size: 5
      num_noise_sample: 4

      noise_scale_s: 10.8
      noise_scale: 1.73

#    scheduler_config:
#      target: ldm.lr_scheduler.LambdaLinearScheduler
#      params:
#        warm_up_steps:
#          - 10000
#        cycle_lengths:
#        - 10000000000000
#        f_start:
#        - 1.0e-06
#        f_max:
#        - 1.0
#        f_min:
#        - 1.0

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 8
        in_channels: 3
        out_channels: 3
        model_channels: 128
        attention_resolutions:
        - 4
        - 2
        - 1
        channel_mult:
        - 1
        - 2
        - 4
        num_res_blocks: 2
#        num_heads: 8
        num_head_channels: 32
        use_spatial_transformer: False
        use_scale_shift_norm: True
        resblock_updown: True
        num_classes: 2
#        transformer_depth: 1
#        context_dim: 2

    cond_stage_config:
      target: ldm.modules.encoders.modules.ClassEmbedder
      params:
        n_classes: 2
        embed_dim: 2
        key: class_label

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 3
        monitor: "val/rec_loss"
#        ckpt_path: ""
        ddconfig:
          double_z: true
          z_channels: 3
          resolution: 32
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 3
          attn_resolutions:
          - 32
          - 16
          - 8
          num_res_blocks: 2
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity
#          target: ldm.modules.losses.LPIPSWithDiscriminator
#          params:
#            disc_start: 50001
#            kl_weight: 1.0e-06
#            disc_weight: 0.5

      # Distribute VAE model for each client
      client_ckpt:
        0: "/home/wenbo/DP-LDMs/logs/pretrained-autoencoder_kl_celeba32_8x8x3-50epoch-federated-0.5alpha/client_0/checkpoints/last.ckpt"
        1: "/home/wenbo/DP-LDMs/logs/pretrained-autoencoder_kl_celeba32_8x8x3-50epoch-federated-0.5alpha/client_1/checkpoints/last.ckpt"
        2: "/home/wenbo/DP-LDMs/logs/pretrained-autoencoder_kl_celeba32_8x8x3-50epoch-federated-0.5alpha/client_2/checkpoints/last.ckpt"
        3: "/home/wenbo/DP-LDMs/logs/pretrained-autoencoder_kl_celeba32_8x8x3-50epoch-federated-0.5alpha/client_3/checkpoints/last.ckpt"
        4: "/home/wenbo/DP-LDMs/logs/pretrained-autoencoder_kl_celeba32_8x8x3-50epoch-federated-0.5alpha/client_4/checkpoints/last.ckpt"
        5: "/home/wenbo/DP-LDMs/logs/pretrained-autoencoder_kl_celeba32_8x8x3-50epoch-federated-0.5alpha/client_5/checkpoints/last.ckpt"


data:

  batch_size1: 32     # Non-DPSGD Training batch size
  batch_size2: 2048   # DP-SGD Training batch size

  target: main.DataModuleFromConfig
  params:
    batch_size: 2048
    num_workers: 4
    wrap: false
    train:
      target: ldm.data.celeba.CelebATrain
      params:
        config:
          size: 32
    validation:
      target: ldm.data.celeba.CelebAValidation
      params:
        config:
          size: 32

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 5000
        max_images: 8
        increase_log_steps: false

  trainer:
    benchmark: true

    epochs1: 3
    epochs2: 30

    accelerator: gpu  # need to be gpu instead of ddp for dp settings
#    max_epochs: 30

    # 最新版训练框架，克服前向过程加噪隐私泄露问题，修改为阶段1主动加入额外高斯噪声 noise_scale_s, 目前方法为 < phase 1 Gaussian DP (no-cond) + phase 2 DP-SGD (cond) + noise multiplicity>
